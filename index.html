<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - UNiTie</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 92 100'%3E%3Cpath d='M30 2H87Q90 2 90 5V70A28 28 0 0 1 62 98H8Q2 98 2 92V30A28 28 0 0 1 30 2Z' fill='%230c0f1a' stroke='%232aaff3' stroke-width='5'/%3E%3Cpath d='M23 18H37V56Q37 66 46 66Q55 66 55 56V18H69V58Q69 82 46 82Q23 82 23 58Z' fill='%232aaff3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0f1a;
    --text: #6a82c8;
    --logo: #2aaff3;
    /* 1 unité = 1px sur la capture d'origine (1920 x 955), mise à l'échelle selon l'écran */
    --u: min(calc(100vw / 1920), calc(100vh / 955));
  }

  @media (max-width: 900px) {
    :root { --u: calc(100vw / 1000); }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: var(--bg);
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    overflow-x: hidden;
    font-family: 'Montserrat', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* Barre latérale étroite visible à gauche sur la capture */
  .rail {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 28px;
    pointer-events: none;
  }
  .rail .mark {
    position: absolute;
    top: 9px;
    left: 0;
    width: 28px;
    text-align: center;
    font-size: 15px;
    font-weight: 500;
    color: #000;
  }
  .rail .line {
    position: absolute;
    left: 0;
    width: 28px;
    height: 1px;
    background: #1a2033;
  }
  .rail .line.top { top: 50px; }
  .rail .line.short { top: 61px; left: 10px; width: 18px; background: #232b42; }
  .rail .line.bottom { bottom: 38px; }
  .rail .chip {
    position: absolute;
    left: 18px;
    bottom: 14px;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    background: #1f2745;
  }

  .stage {
    position: relative;
    width: 100%;
    height: calc(955 * var(--u));
  }

  .stage > * {
    position: absolute;
    left: 50%;
    white-space: pre;
    line-height: 1;
    text-align: center;
  }

  .logo {
    top: calc(98 * var(--u));
    width: calc(92 * var(--u));
    height: calc(100 * var(--u));
    transform: translateX(-50%);
  }
  .logo svg { display: block; width: 100%; height: 100%; }

  .reg {
    top: calc(107 * var(--u));
    left: calc(50% + 54 * var(--u));
    font-size: calc(10 * var(--u));
    font-weight: 700;
    color: var(--logo);
  }

  .error {
    top: calc(272 * var(--u));
    left: calc(50% - 22 * var(--u));
    transform: translateX(-50%);
    font-size: calc(83 * var(--u));
    font-weight: 800;
  }

  .code {
    top: calc(350 * var(--u));
    left: calc(50% - 22 * var(--u));
    transform: translateX(-50%);
    font-size: calc(281 * var(--u));
    font-weight: 800;
  }

  .not-found {
    top: calc(628 * var(--u));
    left: calc(50% - 22 * var(--u));
    transform: translateX(-50%);
    font-size: calc(78 * var(--u));
    font-weight: 800;
  }

  .tagline {
    top: calc(834 * var(--u));
    left: calc(50% - 47 * var(--u));
    transform: translateX(-50%);
    font-size: calc(27 * var(--u));
    font-weight: 500;
  }

  .status {
    top: calc(873 * var(--u));
    left: calc(50% - 56 * var(--u));
    transform: translateX(-50%);
    font-size: calc(19 * var(--u));
    font-weight: 500;
  }
</style>
</head>
<body>

  <div class="rail" aria-hidden="true">
    <span class="mark">U</span>
    <span class="line top"></span>
    <span class="line short"></span>
    <span class="line bottom"></span>
    <span class="chip"></span>
  </div>

  <main class="stage">
    <div class="logo" role="img" aria-label="UNiTie">
      <svg viewBox="0 0 92 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M30 2H87Q90 2 90 5V70A28 28 0 0 1 62 98H8Q2 98 2 92V30A28 28 0 0 1 30 2Z"
              fill="none" stroke="#2aaff3" stroke-width="5" stroke-linejoin="round"/>
        <path d="M23 18H37V56Q37 66 46 66Q55 66 55 56V18H69V58Q69 82 46 82Q23 82 23 58Z"
              fill="#2aaff3"/>
      </svg>
    </div>
    <span class="reg" aria-hidden="true">®</span>

    <p class="error">ERROR</p>
    <h1 class="code">404 !</h1>
    <p class="not-found">NOT FOUND</p>

    <p class="tagline">trade on deriv only</p>
    <p class="status">UNITIE DOWN</p>
  </main>

</body>
</html>
